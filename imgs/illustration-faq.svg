<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-hidden="true">
  <defs>
    <style>
      .faq-person { fill: #1a2942; }
      .faq-qmark { fill: #a4ac49; }
      .faq-accent { fill: #d4a574; }
      .faq-leaf { fill: #a4ac49; opacity: 0.3; }
    </style>
  </defs>

  <!-- Background decorative foliage -->
  <path d="M 30 180 Q 20 150 35 130 Q 40 150 35 170 Q 30 190 30 180" class="faq-leaf" />
  <path d="M 360 220 Q 350 190 365 170 Q 370 190 365 210 Q 360 230 360 220" class="faq-leaf" />
  <circle cx="70" cy="240" r="2.5" class="faq-leaf" />
  <circle cx="320" cy="60" r="2" class="faq-leaf" />

  <!-- Decorative dots -->
  <circle cx="120" cy="80" r="2" class="faq-leaf" />
  <circle cx="280" cy="240" r="1.5" class="faq-leaf" />

  <!-- Large question mark background -->
  <text x="150" y="180" font-size="160" font-weight="700" text-anchor="middle" dominant-baseline="middle" class="faq-qmark" opacity="0.85">?</text>

  <!-- Person - head -->
  <circle cx="280" cy="105" r="20" class="faq-person" />

  <!-- Person - hair -->
  <path d="M 260 105 A 20 20 0 0 1 300 105" class="faq-person" />

  <!-- Person - torso -->
  <ellipse cx="280" cy="145" rx="28" ry="35" class="faq-person" />

  <!-- Person - shirt collar -->
  <path d="M 265 125 L 270 140 L 290 140 L 295 125 Z" class="faq-person" />

  <!-- Person - left arm (thinking pose) -->
  <path d="M 254 135 Q 240 140 235 155" stroke="#1a2942" stroke-width="5" fill="none" stroke-linecap="round" />
  <circle cx="235" cy="155" r="6" class="faq-person" />

  <!-- Person - right arm -->
  <path d="M 306 140 Q 320 145 330 155" stroke="#1a2942" stroke-width="5" fill="none" stroke-linecap="round" />
  <circle cx="330" cy="155" r="6" class="faq-person" />

  <!-- Person - legs -->
  <rect x="272" y="175" width="7" height="30" class="faq-person" rx="3.5" />
  <rect x="289" y="175" width="7" height="30" class="faq-person" rx="3.5" />

  <!-- Person - shoes -->
  <ellipse cx="275.5" cy="208" rx="8" ry="5" class="faq-accent" />
  <ellipse cx="292.5" cy="208" rx="8" ry="5" class="faq-accent" />

  <!-- Person - eyes (thinking expression) -->
  <circle cx="273" cy="100" r="1.5" class="faq-person" />
  <circle cx="287" cy="100" r="1.5" class="faq-person" />

  <!-- Thought bubble indicator -->
  <circle cx="320" cy="85" r="16" fill="none" stroke="#a4ac49" stroke-width="2.5" opacity="0.5" />
  <text x="320" y="92" font-size="16" font-weight="700" text-anchor="middle" class="faq-accent">i</text>

  <!-- Floating accent dot near head -->
  <circle cx="240" cy="70" r="1.5" class="faq-leaf" />
</svg>
